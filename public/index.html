<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench — agentic factory floor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔨</text></svg>">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d333b;
    --text: #e6edf3; --muted: #8b949e; --accent: #4f9cf9; --green: #3fb950;
    --red: #f85149; --amber: #d29922; --purple: #a371f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  select, input, textarea, button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: inherit; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .chips { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .chip { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 3px 12px; font-size: 12px; color: var(--muted); }
  .chip b { color: var(--text); font-weight: 600; }
  #board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 14px; min-height: calc(100vh - 150px); }
  .col { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .col-head { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); display: flex; justify-content: space-between; }
  .col-head .wip { color: var(--amber); } .col-head .count { color: var(--muted); }
  .empty { color: var(--border); text-align: center; padding: 20px 0; }
  .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card.leased { border-left: 3px solid var(--purple); }
  .card-top { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; min-height: 18px; }
  .card-title { font-weight: 600; font-size: 13px; }
  .card-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .pri { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .p4 { background: #f8514933; color: var(--red); } .p3 { background: #d2992233; color: var(--amber); }
  .p2 { background: #4f9cf933; color: var(--accent); } .p1 { background: #3fb95033; color: var(--green); }
  .tag { font-size: 10px; background: #a371f722; color: var(--purple); padding: 1px 7px; border-radius: 10px; }
  .who { font-size: 11px; color: var(--muted); }
  .lease { font-size: 10px; color: var(--purple); }
  .deps { font-size: 11px; color: var(--muted); }
  /* modal */
  .overlay { position: fixed; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 10; }
  .overlay.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: min(620px, 94vw); max-height: 88vh; overflow-y: auto; padding: 20px; }
  .modal h2 { font-size: 15px; margin-bottom: 4px; }
  .modal .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
  .field input, .field textarea, .field select { width: 100%; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .comments { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .comment { padding: 7px 10px; background: var(--panel2); border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
  .comment .who { display: block; font-size: 11px; margin-bottom: 2px; }
  .comment.system { border-left: 3px solid var(--amber); color: var(--muted); font-style: italic; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; margin-bottom: 10px; }
  .kv dt { color: var(--muted); } .kv dd { word-break: break-all; }
  .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; }
  /* tabs */
  .tabs { display: flex; gap: 2px; padding: 0 18px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .tab { background: transparent; color: var(--muted); border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .tab:hover { color: var(--text); background: var(--panel2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  #overview, #live, #debug { padding: 14px; }
</style>
</head>
<body>
<header>
  <h1>Work<span>bench</span></h1>
  <select id="projectSelect"></select>
  <button id="newProjectBtn" title="Create project">+ Project</button>
  <button id="newTaskBtn" class="primary">+ New task</button>
  <button id="githubBtn" title="GitHub repo this project mirrors">GitHub</button>
  <button id="agentsBtn" title="Live agent activity">🤖 Agents</button>
  <button id="providersBtn" title="Inference provider status">⚡ Providers</button>
  <div class="chips" id="chips"></div>
</header>
<nav class="tabs">
  <button class="tab active" data-tab="board">Board</button>
  <button class="tab" data-tab="overview">Overview</button>
  <button class="tab" data-tab="live">Live</button>
  <button class="tab" data-tab="debug">Debug</button>
</nav>
<main>
  <div id="board" class="tab-content active"></div>
  <div id="overview" class="tab-content"></div>
  <div id="live" class="tab-content"></div>
  <div id="debug" class="tab-content">
    <h2 style="font-size:16px;margin-bottom:12px">Debug</h2>
    <div class="comment system">
      <span class="who">🚧 Debug panel coming soon</span>
      <span class="deps">This will show traces, logs, and token usage when OpenTelemetry is integrated.</span>
    </div>
  </div>
</main>

<div class="overlay" id="taskOverlay"><div class="modal" id="taskModal"></div></div>
<div class="overlay" id="formOverlay"><div class="modal" id="formModal"></div></div>
<div class="overlay" id="providersOverlay"><div class="modal" id="providersModal"></div></div>
<div class="overlay" id="agentsOverlay"><div class="modal" id="agentsModal"></div></div>
<div class="overlay" id="githubOverlay"><div class="modal" id="githubModal"></div></div>

<script>
const COLUMNS = ['backlog','todo','doing','review','done','failed'];
const LABELS = { backlog:'Backlog', todo:'To Do', doing:'Doing', review:'Review', done:'Done', failed:'Failed' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMs = ms => ms == null ? '—' : ms < 60e3 ? (ms/1e3).toFixed(0)+'s' : ms < 36e5 ? (ms/6e4).toFixed(1)+'m' : (ms/36e5).toFixed(1)+'h';
const agent = () => localStorage.getItem('wb_agent') || 'agent-1';

const state = { projects: [], project: null, tasks: [], stats: null, ledger: null, activeTab: localStorage.getItem('wb_tab') || 'board' };

// ---------- tab system ----------

function switchTab(tabName) {
  state.activeTab = tabName;
  localStorage.setItem('wb_tab', tabName);

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

  const tabBtn = document.querySelector(`.tab[data-tab="${tabName}"]`);
  const tabContent = document.getElementById(tabName);

  if (tabBtn) tabBtn.classList.add('active');
  if (tabContent) tabContent.classList.add('active');

  // Render tab-specific content
  if (tabName === 'overview') renderOverview();
  if (tabName === 'live') renderLive();
}

function initTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });
  switchTab(state.activeTab);
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  const key = sessionStorage.getItem('wb_key');
  if (key) headers.Authorization = `Bearer ${key}`;
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) {
    const k = prompt('API key required (set WORKBENCH_API_KEY on the server):');
    if (k) { sessionStorage.setItem('wb_key', k); return api(path, opts); }
    throw new Error('unauthorized');
  }
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.statusText); }
  return res.json();
}

function renderOverview() {
  const s = state.stats, l = state.ledger;
  const byColumn = COLUMNS.reduce((acc, col) => {
    acc[col] = state.tasks.filter(t => t.column_name === col).length;
    return acc;
  }, {});

  const completed1h = state.tasks.filter(t => t.completed_at && (Date.now() - new Date(t.completed_at).getTime() < 3600000)).length;

  const byLabel = {};
  state.tasks.forEach(t => {
    (t.labels || []).forEach(label => {
      byLabel[label] = (byLabel[label] || 0) + 1;
    });
  });

  $('#overview').innerHTML = `
    <h2 style="font-size:16px;margin-bottom:14px">Overview</h2>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:20px">
      <div class="comment">
        <span class="who">Total Tasks</span>
        <span class="deps" style="font-size:24px;font-weight:700;color:var(--text)">${state.tasks.length}</span>
      </div>
      <div class="comment">
        <span class="who">WIP Limit</span>
        <span class="deps" style="font-size:24px;font-weight:700;color:var(--amber)">${s?.wip ?? 0}</span>
      </div>
      <div class="comment">
        <span class="who">Done Today</span>
        <span class="deps" style="font-size:24px;font-weight:700;color:var(--green)">${s?.doneToday ?? 0}</span>
      </div>
      <div class="comment">
        <span class="who">Failed</span>
        <span class="deps" style="font-size:24px;font-weight:700;color:var(--red)">${s?.failed ?? 0}</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px">
      <div class="comment">
        <span class="who">Tasks by Column</span>
        <div style="margin-top:8px">
          ${COLUMNS.map(col => `
            <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)">
              <span>${LABELS[col]}</span>
              <span style="font-weight:700">${byColumn[col]}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="comment">
        <span class="who">Performance Metrics</span>
        <div class="kv" style="margin-top:8px">
          <dt>Throughput</dt><dd>${s?.throughputPerDay ?? 0} tasks/day</dd>
          <dt>Cycle Time</dt><dd>${fmtMs(s?.medianCycleMs)}</dd>
          <dt>Completed (1h)</dt><dd>${completed1h}</dd>
          <dt>Total Spend</dt><dd>$${l?.total?.cost ?? 0}</dd>
        </div>
      </div>
    </div>

    ${Object.keys(byLabel).length > 0 ? `
      <div class="comment">
        <span class="who">Tasks by Label</span>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          ${Object.entries(byLabel).sort((a,b) => b[1] - a[1]).map(([label, count]) => `
            <span class="tag">${esc(label)} (${count})</span>
          `).join('')}
        </div>
      </div>
    ` : ''}
  `;
}

function renderLive() {
  $('#live').innerHTML = `
    <h2 style="font-size:16px;margin-bottom:14px">Live Agents</h2>
    <div id="liveAgentsList">Loading…</div>
  `;
  refreshLiveAgents();
}

async function refreshLiveAgents() {
  try {
    const agents = await api('/api/agents');
    const el = $('#liveAgentsList');
    if (!el) return;

    if (!agents.length) {
      el.innerHTML = '<div class="comment system"><span class="who">No agents running</span><span class="deps">Start agents with <code>npm run agents</code></span></div>';
      return;
    }

    const statusColor = {
      starting: '#a371f7',
      running: '#3fb950',
      completed: '#4f9cf9',
      failed: '#f85149',
      killed: '#d29922',
    };

    el.innerHTML = agents.map(a => {
      const task = state.tasks.find(t => t.id === a.task_id);
      const taskTitle = task ? task.title : 'Unknown task';
      const elapsed = a.started_at ? Date.now() - new Date(a.started_at).getTime() : 0;
      const elapsedStr = fmtMs(elapsed);

      return `
        <div class="comment ${a.status === 'failed' ? 'system' : ''}" style="border-left:3px solid ${statusColor[a.status] || '#8b949e'}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span class="who"><b>${esc(taskTitle)}</b></span>
            <span style="font-size:11px;color:${statusColor[a.status] || '#8b949e'};font-weight:600">${a.status.toUpperCase()}</span>
          </div>
          <div class="kv" style="font-size:11px">
            <dt>Task ID</dt><dd>${a.task_id}</dd>
            <dt>Agent ID</dt><dd>${a.id.slice(0,12)}</dd>
            <dt>Elapsed</dt><dd>${elapsedStr}</dd>
            ${a.last_commit ? `<dt>Last Commit</dt><dd>${a.last_commit.slice(0,8)}</dd>` : ''}
            ${a.last_log_line ? `<dt>Last Log</dt><dd>${esc(a.last_log_line).slice(0,80)}</dd>` : ''}
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    const el = $('#liveAgentsList');
    if (el) el.innerHTML = `<div class="comment system"><span class="who">Error: ${esc(e.message)}</span></div>`;
  }
}

async function boot() {
  state.projects = await api('/api/projects');
  renderProjectSelect();
  await refresh();
  initTabs();
  const es = new EventSource('/events');
  for (const ev of ['task.create','task.move','task.claim','task.release','task.retry','task.update','task.delete','comment.add','run.record','project.create','wip.update']) {
    es.addEventListener(ev, () => refresh());
  }
  for (const ev of ['agent.register','agent.update','agent.end']) {
    es.addEventListener(ev, () => { if (state.activeTab === 'live') refreshLiveAgents(); });
  }
  setInterval(refresh, 30000);
  setInterval(() => { if (state.activeTab === 'live') refreshLiveAgents(); }, 10000);
}

async function refresh() {
  const qs = state.project ? `?project_id=${state.project}` : '';
  try {
    [state.tasks, state.stats, state.ledger, state.providers] = await Promise.all([
      api('/api/tasks' + qs), api('/api/stats'), api('/api/ledger'), api('/api/providers'),
    ]);
    renderChips();
    renderBoard();
    if (state.activeTab === 'overview') renderOverview();
    if (state.activeTab === 'live') refreshLiveAgents();
  } catch (e) { console.error(e); }
}

function renderProjectSelect() {
  $('#projectSelect').innerHTML =
    `<option value="">All projects</option>` +
    state.projects.map(p => `<option value="${p.id}" ${p.id === state.project ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
}

function renderChips() {
  const s = state.stats, l = state.ledger;
  const up = (state.providers?.providers || []).filter(p => p.healthy).length;
  const total = (state.providers?.providers || []).length;
  const repo = state.project ? state.projects.find(p => p.id === state.project)?.repo : null;
  $('#chips').innerHTML = [
    `<span class="chip">WIP <b>${s?.wip ?? 0}</b></span>`,
    `<span class="chip">Done today <b>${s?.doneToday ?? 0}</b></span>`,
    `<span class="chip">Throughput <b>${s?.throughputPerDay ?? 0}/day</b></span>`,
    `<span class="chip">Cycle time <b>${fmtMs(s?.medianCycleMs)}</b></span>`,
    `<span class="chip">Failed <b>${s?.failed ?? 0}</b></span>`,
    `<span class="chip">Spend <b>$${l?.total?.cost ?? 0}</b></span>`,
    `<span class="chip" title="Healthy inference providers">⚡ <b>${up}/${total}</b></span>`,
    repo
      ? `<span class="chip" title="Issues on this repo become tasks; done tasks close them">↔ <b>${esc(repo)}</b></span>`
      : `<span class="chip" title="Bind this project to a repo with the GitHub button">↔ no repo</span>`,
  ].join('');
}

function renderBoard() {
  const byCol = Object.fromEntries(COLUMNS.map(c => [c, []]));
  for (const t of state.tasks) (byCol[t.column_name] ||= []).push(t);
  const wipMap = Object.fromEntries((state.project ? (state.projects.find(p => p.id === state.project)?.wip || []) : []).map(w => [w.column_name, w.limit_value]));
  $('#board').innerHTML = COLUMNS.map(col => {
    const tasks = byCol[col];
    const wip = wipMap[col];
    const badge = wip != null && wip > 0
      ? `<span class="wip">${tasks.length}/${wip}</span>`
      : `<span class="count">${tasks.length}</span>`;
    return `<div class="col"><div class="col-head">${LABELS[col]}${badge}</div>` +
      (tasks.map(cardHtml).join('') || '<div class="empty">—</div>') + '</div>';
  }).join('');
  document.querySelectorAll('.card').forEach(el => el.onclick = () => openTask(el.dataset.id));
}

function cardHtml(t) {
  const leased = !!t.lease_holder;
  const pri = t.priority ? `<span class="pri p${Math.min(Math.max(t.priority,1),4)}">P${t.priority}</span>` : '';
  const lease = leased ? `<span class="lease">🔒 ${esc(t.lease_holder)}</span>` : '';
  const labels = (t.labels || []).map(l => `<span class="tag">${esc(l)}</span>`).join('');
  const deps = t.deps?.length ? `<span class="deps">⛓ ${t.deps.length} dep</span>` : '';
  const who = t.assignee ? `<span class="who">@${esc(t.assignee)}</span>` : '';
  return `<div class="card ${leased ? 'leased' : ''}" data-id="${t.id}">
    <div class="card-top">${pri}${lease}</div>
    <div class="card-title">${esc(t.title)}</div>
    <div class="card-meta">${labels}${deps}${who}</div>
  </div>`;
}

// ---------- task detail ----------

async function openTask(id) {
  const t = await api(`/api/tasks/${id}`);
  const comments = await api(`/api/tasks/${id}/comments`);
  const moveBtns = COLUMNS.filter(c => c !== t.column_name).map(c =>
    `<button data-move="${c}">→ ${LABELS[c]}</button>`).join('');
  $('#taskModal').innerHTML = `
    <h2>${esc(t.title)}</h2>
    <div class="sub">${t.id} · ${LABELS[t.column_name]}${t.requires_review ? ' · 🔍 requires review' : ''}${t.retry_count ? ` · retry ${t.retry_count}/${t.max_retries}` : ''}</div>
    <dl class="kv">
      <dt>Assignee</dt><dd>${esc(t.assignee || '—')}</dd>
      <dt>Priority</dt><dd>${t.priority || '—'}</dd>
      <dt>Labels</dt><dd>${(t.labels || []).join(', ') || '—'}</dd>
      <dt>Deps</dt><dd>${(t.deps || []).join(', ') || 'none'}</dd>
      <dt>Lease</dt><dd>${t.lease_holder ? `${esc(t.lease_holder)} until ${new Date(t.lease_expires_at).toLocaleTimeString()}` : 'unclaimed'}</dd>
      <dt>Created</dt><dd>${new Date(t.created_at).toLocaleString()}</dd>
      ${t.started_at ? `<dt>Started</dt><dd>${new Date(t.started_at).toLocaleString()}</dd>` : ''}
      ${t.completed_at ? `<dt>Completed</dt><dd>${new Date(t.completed_at).toLocaleString()}</dd>` : ''}
    </dl>
    ${t.description ? `<div class="field"><label>Description</label><div>${esc(t.description)}</div></div>` : ''}
    <div class="actions">
      ${t.lease_holder === agent()
        ? `<button data-release>Release lease</button>`
        : `<button data-claim class="primary">Claim as ${esc(agent())}</button>`}
      ${moveBtns}
      <button data-delete style="color:var(--red)">Delete</button>
    </div>
    <div class="err" id="taskErr"></div>
    <div class="comments">
      <h3 style="font-size:12px;margin-bottom:8px">Activity</h3>
      <div id="commentList">${comments.map(c =>
        `<div class="comment ${c.system ? 'system' : ''}"><span class="who">${esc(c.author)} · ${new Date(c.created_at).toLocaleString()}</span>${esc(c.body)}</div>`).join('') || '<div class="empty">no activity</div>'}</div>
      <div class="row" style="margin-top:10px">
        <input id="commentInput" placeholder="Add a comment…">
        <button id="commentBtn" style="flex:0 0 auto">Post</button>
      </div>
    </div>`;
  $('#taskOverlay').classList.add('open');

  $('#taskModal').querySelectorAll('[data-move]').forEach(b => b.onclick = async () => {
    try { await api(`/api/tasks/${id}/move`, { method: 'POST', body: JSON.stringify({ column: b.dataset.move, actor: agent() }) }); closeModal(); refresh(); }
    catch (e) { $('#taskErr').textContent = e.message; }
  });
  const claimBtn = $('#taskModal').querySelector('[data-claim]');
  if (claimBtn) claimBtn.onclick = async () => {
    try { await api(`/api/tasks/${id}/claim`, { method: 'POST', body: JSON.stringify({ agent: agent() }) }); closeModal(); refresh(); }
    catch (e) { $('#taskErr').textContent = e.message; }
  };
  const relBtn = $('#taskModal').querySelector('[data-release]');
  if (relBtn) relBtn.onclick = async () => {
    try { await api(`/api/tasks/${id}/release`, { method: 'POST', body: JSON.stringify({ agent: agent() }) }); closeModal(); refresh(); }
    catch (e) { $('#taskErr').textContent = e.message; }
  };
  $('#taskModal').querySelector('[data-delete]').onclick = async () => {
    if (!confirm('Delete this task?')) return;
    try { await api(`/api/tasks/${id}`, { method: 'DELETE', body: JSON.stringify({ actor: agent() }) }); closeModal(); refresh(); }
    catch (e) { $('#taskErr').textContent = e.message; }
  };
  $('#commentBtn').onclick = async () => {
    const body = $('#commentInput').value.trim();
    if (!body) return;
    try { await api(`/api/tasks/${id}/comments`, { method: 'POST', body: JSON.stringify({ author: agent(), body }) }); openTask(id); }
    catch (e) { $('#taskErr').textContent = e.message; }
  };
}

function closeModal() { $('#taskOverlay').classList.remove('open'); $('#formOverlay').classList.remove('open'); }

// ---------- new task form ----------

function openForm() {
  $('#formModal').innerHTML = `
    <h2>New task</h2>
    <div class="sub">Lands in backlog. Set deps to gate it, or a follow-up to chain it on completion.</div>
    <div class="field"><label>Title</label><input id="f_title"></div>
    <div class="field"><label>Description</label><textarea id="f_desc" rows="3"></textarea></div>
    <div class="row">
      <div class="field"><label>Project</label><select id="f_project">${state.projects.map(p => `<option value="${p.id}" ${p.id === state.project ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Assignee</label><input id="f_assignee" placeholder="${esc(agent())}"></div>
      <div class="field"><label>Priority (1–4)</label><input id="f_priority" type="number" min="0" max="4" value="0"></div>
    </div>
    <div class="row">
      <div class="field"><label>Labels (comma-separated)</label><input id="f_labels" placeholder="backend, migration"></div>
      <div class="field"><label>Depends on (task ids, comma-separated)</label><input id="f_deps" placeholder="t_abc123"></div>
    </div>
    <div class="row">
      <div class="field"><label>Auto-chain follow-up on completion</label><input id="f_next" placeholder="e.g. Write tests for X"></div>
      <div class="field"><label>Max retries</label><input id="f_retries" type="number" min="0" max="10" value="3"></div>
    </div>
    <div class="field"><label><input type="checkbox" id="f_review"> Requires review before done</label></div>
    <div class="actions"><button class="primary" id="f_create">Create task</button><button id="f_cancel">Cancel</button></div>
    <div class="err" id="formErr"></div>`;
  $('#formOverlay').classList.add('open');
  $('#f_cancel').onclick = closeModal;
  $('#f_create').onclick = async () => {
    const split = s => s.split(',').map(x => x.trim()).filter(Boolean);
    try {
      await api('/api/tasks', { method: 'POST', body: JSON.stringify({
        project_id: $('#f_project').value,
        title: $('#f_title').value,
        description: $('#f_desc').value,
        assignee: $('#f_assignee').value || agent(),
        priority: +$('#f_priority').value || 0,
        labels: split($('#f_labels').value),
        deps: split($('#f_deps').value),
        next_task_title: $('#f_next').value,
        requires_review: $('#f_review').checked,
        max_retries: +$('#f_retries').value || 3,
      })});
      closeModal(); refresh();
    } catch (e) { $('#formErr').textContent = e.message; }
  };
}

// ---------- providers panel ----------

async function openProviders() {
  const { providers } = await api('/api/providers');
  const dot = p => p.healthy ? '🟢' : p.configured ? '🔴' : '⚪';
  $('#providersModal').innerHTML = `
    <h2>Inference providers</h2>
    <div class="sub">The router pools every configured provider and falls back automatically on rate limits.
    Keys live in your <code>.env</code> file — they are never stored here or in the database.</div>
    ${providers.map(p => `
      <div class="comment ${p.healthy ? '' : 'system'}">
        <span class="who">${dot(p)} <b>${esc(p.provider)}</b> · tier ${p.tier}
        ${p.configured
          ? ` · avg ${p.avg_latency_ms ?? '—'}ms · ${p.fails} fail${p.fails === 1 ? '' : 's'}`
          : ' — not configured'}</span>
        <span class="deps">${(p.models || []).join(' · ')}</span>
      </div>`).join('')}
    <div class="actions"><button onclick="document.getElementById('providersOverlay').classList.remove('open')">Close</button></div>`;
  $('#providersOverlay').classList.add('open');
}

// ---------- agents panel (live activity) ----------

async function openAgents() {
  $('#agentsModal').innerHTML = `
    <h2>Agent Activity</h2>
    <div class="sub">Live view of running agents. Connects via SSE for real-time updates.</div>
    <div id="agentsList">Loading…</div>
    <div class="actions"><button onclick="document.getElementById('agentsOverlay').classList.remove('open')">Close</button></div>`;
  $('#agentsOverlay').classList.add('open');
  await refreshAgents();
  startAgentsSSE();
}

async function refreshAgents() {
  try {
    const agents = await api('/api/agents');
    renderAgents(agents);
  } catch (e) {
    $('#agentsList').innerHTML = `<div class="comment system"><span class="who">Failed to load: ${esc(e.message)}</span></div>`;
  }
}

function renderAgents(agents) {
  if (!agents.length) {
    $('#agentsList').innerHTML = '<div class="empty">No agents running</div>';
    return;
  }
  const statusColor = {
    starting: '#a371f7',
    running: '#3fb950',
    completed: '#4f9cf9',
    failed: '#f85149',
    killed: '#d29922',
  };
  $('#agentsList').innerHTML = agents.map(a => {
    const task = state.tasks.find(t => t.id === a.task_id);
    const taskTitle = task ? task.title : 'unknown';
    const elapsed = a.started_at ? Date.now() - new Date(a.started_at).getTime() : 0;
    const elapsedStr = elapsed < 60000 ? `${(elapsed/1000).toFixed(0)}s`
      : elapsed < 3600000 ? `${(elapsed/60000).toFixed(1)}m` : `${(elapsed/3600000).toFixed(1)}h`;
    return `
      <div class="comment ${a.status === 'failed' ? 'system' : ''}" style="border-left: 3px solid ${statusColor[a.status] || '#8b949e'}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span class="who"><b>${esc(taskTitle)}</b> (${a.task_id.slice(0,12)})</span>
          <span style="font-size:11px;color:${statusColor[a.status] || '#8b949e'};font-weight:600">${a.status.toUpperCase()}</span>
        </div>
        <div class="kv" style="font-size:11px;margin-bottom:6px">
          <dt>Agent ID</dt><dd>${a.id.slice(0,12)}</dd>
          <dt>PID</dt><dd>${a.pid || '—'}</dd>
          <dt>Worktree</dt><dd>${a.worktree_dir ? esc(a.worktree_dir).slice(-60) : '—'}</dd>
          <dt>Elapsed</dt><dd>${elapsedStr}</dd>
          <dt>Last commit</dt><dd>${a.last_commit ? a.last_commit.slice(0,8) : '—'}</dd>
          <dt>Last log</dt><dd>${a.last_log_line ? esc(a.last_log_line).slice(0,80) : '—'}</dd>
        </div>
        ${a.ended_at ? `<div class="deps">Ended: ${new Date(a.ended_at).toLocaleString()}</div>` : ''}
      </div>`;
  }).join('');
}

let agentsSSE = null;
function startAgentsSSE() {
  if (agentsSSE) agentsSSE.close();
  agentsSSE = new EventSource('/events');
  agentsSSE.addEventListener('agent.register', async (e) => {
    const data = JSON.parse(e.data);
    console.log('[agent.register]', data);
    await refreshAgents();
  });
  agentsSSE.addEventListener('agent.update', async (e) => {
    const data = JSON.parse(e.data);
    console.log('[agent.update]', data);
    await refreshAgents();
  });
  agentsSSE.addEventListener('agent.end', async (e) => {
    const data = JSON.parse(e.data);
    console.log('[agent.end]', data);
    await refreshAgents();
  });
  agentsSSE.onerror = () => {
    console.log('[agents SSE] connection lost, reconnecting in 5s');
    setTimeout(startAgentsSSE, 5000);
  };
}

function stopAgentsSSE() {
  if (agentsSSE) { agentsSSE.close(); agentsSSE = null; }
}

// Listen for overlay close to stop SSE
document.getElementById('agentsOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('agentsOverlay')) stopAgentsSSE();
});

// ---------- github panel ----------
//
// A picker, not a prompt: the panel lists the repos the token can see, flags
// whichever one this working directory points at, and binds on click. Nobody
// should have to type an owner/repo they can't easily get wrong.

let githubRepos = null; // cached across opens; "Refresh" refetches

async function openGithub() {
  $('#githubOverlay').classList.add('open');
  await renderGithub();
}

async function renderGithub({ refresh = false } = {}) {
  const el = $('#githubModal');
  const project = state.projects.find(p => p.id === state.project);

  el.innerHTML = `<h2>GitHub</h2><div class="sub">Loading repos…</div>`;

  let data;
  try {
    if (refresh || !githubRepos) githubRepos = await api('/api/github/repos');
    data = githubRepos;
  } catch (e) {
    el.innerHTML = `<h2>GitHub</h2><div class="sub">Could not load repos: ${esc(e.message)}</div>
      <div class="actions"><button onclick="document.getElementById('githubOverlay').classList.remove('open')">Close</button></div>`;
    return;
  }

  const status = data.connected
    ? `<div class="comment"><span class="who">🟢 Connected</span><span class="deps">Repos are listed from your token — never typed.</span></div>`
    : `<div class="comment system"><span class="who">⚪ Not connected</span>
       <span class="deps">Run <code>gh auth login</code>, or POST a token to <code>/api/github/setup</code>.</span></div>`;

  const bound = project?.repo || null;
  const head = `
    <h2>GitHub</h2>
    ${status}
    <div class="comment">
      <span class="who">Project: <b>${project ? esc(project.name) : '— none selected —'}</b></span>
      <span class="deps">${bound
        ? `mirrors <b>${esc(bound)}</b> — issues become tasks, done tasks close them`
        : 'not bound to a repo yet — pick one below'}</span>
    </div>`;

  if (!data.connected) {
    el.innerHTML = `${head}<div class="actions"><button onclick="document.getElementById('githubOverlay').classList.remove('open')">Close</button></div>`;
    return;
  }

  if (!project) {
    el.innerHTML = `${head}<div class="comment system"><span class="who">Select a project first — a repo binds to one project.</span></div>
      <div class="actions"><button onclick="document.getElementById('githubOverlay').classList.remove('open')">Close</button></div>`;
    return;
  }

  // The repo this checkout points at goes first — it's almost always the answer.
  const sorted = [...data.repos].sort((a, b) => {
    if (a.repo === data.detected) return -1;
    if (b.repo === data.detected) return 1;
    return String(b.pushed_at || '').localeCompare(String(a.pushed_at || ''));
  });

  el.innerHTML = `${head}
    <div class="sub">Pick the repo ${esc(project.name)} mirrors. Click the bound one again to unbind.</div>
    <div id="repoList">
      ${sorted.map(r => {
        const isBound = r.repo === bound;
        const isDetected = r.repo === data.detected;
        return `<div class="comment repoRow ${isBound ? 'bound' : ''}" data-repo="${esc(r.repo)}" style="cursor:pointer">
          <span class="who">${isBound ? '✅' : '⬜'} <b>${esc(r.repo)}</b>
            ${isDetected ? '· <span title="This is where your terminal is">📍 this checkout</span>' : ''}
            ${r.private ? '· private' : ''}</span>
          <span class="deps">${r.open_issues} open issue${r.open_issues === 1 ? '' : 's'} · pushed ${esc(String(r.pushed_at || '—').slice(0, 10))}</span>
        </div>`;
      }).join('') || '<div class="comment system"><span class="who">No repos visible to this token.</span></div>'}
    </div>
    <div class="actions">
      <button id="ghSyncBtn">Sync now</button>
      <button id="ghRefreshBtn">Refresh list</button>
      <button onclick="document.getElementById('githubOverlay').classList.remove('open')">Close</button>
      <span id="ghStatus" class="deps"></span>
    </div>`;

  el.querySelectorAll('.repoRow').forEach(row => {
    row.onclick = async () => {
      const repo = row.dataset.repo;
      const next = repo === bound ? null : repo; // click the bound one to unbind
      try {
        await api(`/api/projects/${project.id}/github`, { method: 'POST', body: JSON.stringify({ repo: next }) });
        state.projects = await api('/api/projects');
        await renderGithub();
        renderChips();
      } catch (e) { $('#ghStatus').textContent = e.message; }
    };
  });

  $('#ghSyncBtn').onclick = async () => {
    const s = $('#ghStatus');
    s.textContent = 'Syncing…';
    try {
      const r = await api('/api/projects/sync', { method: 'POST', body: JSON.stringify({ project_id: project.id }) });
      const created = r.imported?.created?.length ?? 0;
      const moved = r.reconciled?.moved?.length ?? 0;
      const pushed = (r.pushed || []).reduce((a, p) => a + (p.count || 0), 0);
      s.textContent = r.skipped || `Imported ${created}, moved ${moved}, pushed ${pushed} comment(s)`;
      if (created || moved) await refresh();
    } catch (e) { s.textContent = e.message; }
  };

  $('#ghRefreshBtn').onclick = () => renderGithub({ refresh: true });
}

// ---------- header wiring ----------

$('#newTaskBtn').onclick = openForm;
$('#agentsBtn').onclick = openAgents;
$('#providersBtn').onclick = openProviders;
$('#projectSelect').onchange = e => { state.project = e.target.value || null; refresh(); };
$('#newProjectBtn').onclick = async () => {
  const name = prompt('Project name:');
  if (!name) return;
  const p = await api('/api/projects', { method: 'POST', body: JSON.stringify({ name }) });
  state.projects = await api('/api/projects');
  state.project = p.id;
  renderProjectSelect(); refresh();
};

// GitHub: opens the repo picker. See openGithub() above.
$('#githubBtn').onclick = openGithub;
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) closeModal(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

boot().catch(e => { document.body.insertAdjacentHTML('afterbegin', `<div style="padding:10px;color:var(--red)">Failed to load: ${esc(e.message)} — is the server running? (npm start)</div>`); });
</script>
